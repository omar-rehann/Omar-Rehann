    <!-- Project data + renderer (must run BEFORE main.js so Swiper sees the image) -->
    <script src="projects-data.js"></script>
    <script>
        (function() {
            var ids = Object.keys(PROJECTS);
            var id = new URLSearchParams(location.search).get('id');
            var p = PROJECTS[id];
            if (!p) {
                location.replace('./index.html#portfolio');
                return;
            }

            var $ = function(x) {
                return document.getElementById(x);
            };
            var i = ids.indexOf(id);

            document.title = p.title + ' | Omar Rehan';
            $('pd-heading').textContent = p.title;
            $('pd-crumb').textContent = p.title;
            $('pd-title').textContent = p.title;
            $('pd-category').textContent = p.category;
            var imgs = p.images || [p.image];
            imgs.forEach(function(name) {
                var slide = document.createElement('div');
                slide.className = 'swiper-slide';
                var im = document.createElement('img');
                im.className = 'img-fluid';
                im.src = 'assets/img/portfolio/all/' + name;
                im.alt = p.title;
                slide.appendChild(im);
                $('pd-slides').appendChild(slide);
            });
            if (imgs.length > 1) {
                var cfgEl = $('pd-swiper-config');
                var cfg = JSON.parse(cfgEl.textContent);
                cfg.loop = true;
                cfg.autoplay = {
                    delay: 5000
                };
                cfgEl.textContent = JSON.stringify(cfg);
            }

            if (p.url) {
                $('pd-url').href = p.url;
                $('pd-url').textContent = p.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
                $('pd-btn').href = p.url;
                $('pd-btn').textContent = p.linkLabel || 'Live Demo';
            } else {
                $('pd-url-row').hidden = true;
                $('pd-btn').hidden = true;
            }

            if (p.date) {
                $('pd-date').textContent = p.date;
                $('pd-date-row').hidden = false;
            }
            if (p.description) {
                $('pd-desc').textContent = p.description;
                $('pd-desc-wrap').hidden = false;
            }
            if (p.tech && p.tech.length) {
                p.tech.forEach(function(t) {
                    var s = document.createElement('span');
                    s.className = 'badge bg-dark';
                    s.textContent = t;
                    $('pd-tech').appendChild(s);
                });
                $('pd-tech-wrap').hidden = false;
            }
            if (p.description || (p.tech && p.tech.length)) $('pd-extra').hidden = false;

            $('pd-prev').href = '?id=' + ids[(i - 1 + ids.length) % ids.length];
            $('pd-next').href = '?id=' + ids[(i + 1) % ids.length];
        })();
    </script>
